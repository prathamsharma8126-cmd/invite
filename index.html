/* Read the invitation from the hash, then the query string, then the parent window if it is readable. */
function routeParams(){
  const sources=[location];
  try{if(window.top&&window.top!==window)sources.push(window.top.location)}catch(_){}
  for(const loc of sources){
    let fragment="",query="";
    try{fragment=loc.hash.slice(1).replace(/^\?/,"");query=loc.search}catch(_){continue}
    // Some sharing surfaces percent-encode the entire fragment, including its separators.
    if(!fragment.includes("=")&&/%(?:3D|26)/i.test(fragment))try{fragment=decodeURIComponent(fragment)}catch(_){}
    const hash=new URLSearchParams(fragment),search=new URLSearchParams(query);
    const view=hash.get("view")??search.get("view"),inv=hash.get("inv")??search.get("inv"),c=hash.get("c")??search.get("c"),admin=hash.has("admin")||search.has("admin");
    if(view||inv||c||admin)return {view,inv,c,admin};
  }
  return {view:null,inv:null,c:null,admin:false};
}

async function fetchClient(id){
  const url=SHEET_URL+(SHEET_URL.includes("?")?"&":"?")+new URLSearchParams({action:"client",id}).toString();
  let last;
  for(let attempt=0;attempt<3;attempt++){
    try{
      const res=await sheetFetch(url,{});const j=await res.json();

    }catch(err){if(err&&(err.code==="not_found"||err.code==="bad_data"))throw err;last=err}
    await wait(500*(attempt+1));
  }
  throw last||{code:"network"};
}

function makeClientId(first,second){

  let base=(slug(first)+"-"+slug(second)).replace(/^-+|-+$/g,"").slice(0,36).replace(/-+$/,"");

}

async function renderRoute(){
  const params=routeParams(),token=++routeToken;
  if(params.c&&SHEET_URL){
    app.innerHTML=loadingMarkup();
    try{
      const data=await fetchClient(params.c);if(token!==routeToken)return;
      app.innerHTML=invitationMarkup(data);updateInvitation(data);lucide.createIcons();setupInvitation(()=>data,{clientId:params.c});
    }catch(err){
      if(token!==routeToken)return;
      app.innerHTML=unavailableMarkup(err&&err.code==="not_found"?"We could not find this invitation. Please check the link or ask your host for a new one.":err&&err.code==="bad_data"?"This invitation is not ready yet. Please ask your host to check its details.":"We could not load the invitation right now. Please check your connection and try again in a moment.");
    }
    return;
  }
  if(params.view==="guest"||params.inv){ const data=decodeSettings(params.inv);if(!data){  app.innerHTML='<main class="invitation canva-container"><header class="canva-header"><p class="eyebrow topline canva-text">THE GOLDEN DATE</p><h1 class="script-title">Invitation unavailable</h1></header><p class="message canva-text" role="alert">We could not read the details in this invitation link. Please ask your host for a new link.</p></main>';  return;}app.innerHTML=invitationMarkup(data);updateInvitation(data);lucide.createIcons();setupInvitation(()=>data);  }else if(SHEET_URL&&!params.admin){app.innerHTML=landingMarkup()}
  else{ document.documentElement.style.setProperty("--gold",defaults.accent);renderStudio();  }
}
renderRoute(); window.addEventListener("hashchange",renderRoute); </script>  </body> </html>
